# CI — blueprint §13.2 (required checks on protected main), §14 (required suites),
# backlog S0-05. Job names `php`, `swift`, `secrets-scan` and `fixtures` are stable: they are
# the required status checks configured in S0-27 (docs/contributing/branch-protection.md,
# together with `commitlint` from commitlint.yml). Do not rename them.
#
# "Born green": the Laravel app (S0-26) and the Xcode project (S0-25) do not exist yet.
# Each job detects its inputs and skips with a clear log line when they are absent, then
# does real work as soon as they land. Nothing here needs a secret or a signing identity
# (signing is S0-20). Every third-party action is pinned to a full commit SHA.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  # Matches the local toolchain (Xcode 26.2 / Swift 6.2.3). Bump deliberately, with S0-22.
  XCODE_VERSION: '26.2'
  # Leave empty to auto-detect the first shared scheme of the project in apps/macos.
  XCODE_SCHEME: ''

jobs:
  php:
    name: php
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Laravel app
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          has_composer=false; has_npm=false; has_phpstan=false
          [ -f composer.json ] && has_composer=true
          [ -f package.json ] && has_npm=true
          for f in phpstan.neon phpstan.neon.dist phpstan.dist.neon; do
            [ -f "$f" ] && has_phpstan=true
          done
          {
            echo "has_composer=$has_composer"
            echo "has_npm=$has_npm"
            echo "has_phpstan=$has_phpstan"
          } >> "$GITHUB_OUTPUT"
          if [ "$has_composer" = false ]; then
            echo "::notice title=php::No composer.json at the repo root yet (lands with S0-26). Skipping PHP lint, static analysis and tests."
          fi

      - name: Require committed lockfiles
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f composer.lock ]; then
            echo "::error file=composer.json::composer.lock is missing. Pinned dependencies are required (blueprint §11)."
            exit 1
          fi
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is missing. Pinned dependencies are required (blueprint §11)."
            exit 1
          fi

      - name: Set up PHP ${{ env.PHP_VERSION }}
        if: steps.detect.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, dom, ctype, curl, fileinfo, intl, bcmath, zip, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      # Two Composer "warnings" are policy here, and --strict would turn them into failures:
      #   --no-check-version  release-policy §2.3 requires a `version` field in composer.json
      #                       (mirrored by config('app.version')).
      #   --no-check-all      ADR-004 D1 pins laravel/ai to an exact version on purpose.
      # Schema validation, publish checks and lockfile freshness remain enforced.
      - name: Validate composer.json and lockfile freshness
        if: steps.detect.outputs.has_composer == 'true'
        run: composer validate --strict --no-check-all --no-check-version --no-interaction

      - name: Resolve Composer cache directory
        if: steps.detect.outputs.has_composer == 'true'
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        if: steps.detect.outputs.has_composer == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Prepare environment file
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Install Composer dependencies
        if: steps.detect.outputs.has_composer == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi

      - name: Generate application key
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artisan ] && [ -f .env ]; then
            php artisan key:generate --ansi --no-interaction
          fi

      - name: Set up Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.has_npm == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        if: steps.detect.outputs.has_npm == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        if: steps.detect.outputs.has_npm == 'true'
        run: npm run build --if-present

      - name: Fail on dirty lockfiles
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- composer.lock package-lock.json; then
            echo "::error::Installing dependencies modified a lockfile. Commit the updated composer.lock / package-lock.json."
            exit 1
          fi

      - name: Pint (code style)
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x vendor/bin/pint ]; then
            echo "::error::laravel/pint is not installed. Add it to require-dev; PSR-12 is mandatory (CONTRIBUTING.md)."
            exit 1
          fi
          vendor/bin/pint --test

      - name: Larastan / PHPStan (static analysis)
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.has_phpstan }}" != true ]; then
            echo "::notice title=php::No phpstan.neon found; static analysis skipped until it is configured."
            exit 0
          fi
          if [ ! -x vendor/bin/phpstan ]; then
            echo "::error::phpstan.neon exists but vendor/bin/phpstan is missing. Add larastan/larastan to require-dev."
            exit 1
          fi
          vendor/bin/phpstan analyse --no-progress --no-interaction --memory-limit=1G

      - name: Pest (test suite)
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x vendor/bin/pest ]; then
            echo "::error::vendor/bin/pest is missing. Pest is the chosen test framework (docs/OPEN-QUESTIONS.md A7)."
            exit 1
          fi
          vendor/bin/pest --ci

  swift:
    name: swift
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Xcode project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          kind=none; container=''
          workspace=$(find apps/macos -maxdepth 3 -name '*.xcworkspace' -not -path '*.xcodeproj/*' 2>/dev/null | sort | head -n 1 || true)
          project=$(find apps/macos -maxdepth 3 -name '*.xcodeproj' 2>/dev/null | sort | head -n 1 || true)
          if [ -n "$workspace" ]; then
            kind=workspace; container="$workspace"
          elif [ -n "$project" ]; then
            kind=project; container="$project"
          elif [ -f apps/macos/Package.swift ]; then
            kind=package; container=apps/macos
          fi
          {
            echo "kind=$kind"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"
          if [ "$kind" = none ]; then
            echo "::notice title=swift::No .xcworkspace, .xcodeproj or Package.swift under apps/macos yet (lands with S0-25). Skipping the Swift build."
          else
            echo "Found $kind: $container"
          fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: steps.detect.outputs.kind != 'none'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        if: steps.detect.outputs.kind != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/SourcePackages
            apps/macos/.build
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/macos/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve scheme
        if: steps.detect.outputs.kind == 'project' || steps.detect.outputs.kind == 'workspace'
        id: scheme
        shell: bash
        env:
          KIND: ${{ steps.detect.outputs.kind }}
          CONTAINER: ${{ steps.detect.outputs.container }}
        run: |
          set -euo pipefail
          scheme="$XCODE_SCHEME"
          if [ -z "$scheme" ]; then
            scheme=$(xcodebuild -list -json "-$KIND" "$CONTAINER" | jq -r ".$KIND.schemes[0] // empty")
          fi
          if [ -z "$scheme" ]; then
            echo "::error::No shared scheme found in $CONTAINER. Share the app scheme (xcshareddata) or set XCODE_SCHEME in ci.yml."
            exit 1
          fi
          echo "Using scheme: $scheme"
          echo "name=$scheme" >> "$GITHUB_OUTPUT"

      - name: Build and test (no signing)
        if: steps.detect.outputs.kind == 'project' || steps.detect.outputs.kind == 'workspace'
        shell: bash
        env:
          KIND: ${{ steps.detect.outputs.kind }}
          CONTAINER: ${{ steps.detect.outputs.container }}
          SCHEME: ${{ steps.scheme.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            "-$KIND" "$CONTAINER" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath build/ci.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Build and test Swift package (no signing)
        if: steps.detect.outputs.kind == 'package'
        shell: bash
        working-directory: ${{ steps.detect.outputs.container }}
        run: |
          set -euo pipefail
          swift --version
          swift build
          swift test

      - name: Upload xcresult bundle
        if: failure() && (steps.detect.outputs.kind == 'project' || steps.detect.outputs.kind == 'workspace')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: build/ci.xcresult
          if-no-files-found: ignore
          retention-days: 7

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gitleaks CLI (MIT) pinned by version and SHA-256. The gitleaks-action wrapper is not
      # used because it requires a GITLEAKS_LICENSE secret for organisation repositories.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan git history for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks git . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-${{ github.run_id }}
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect fixture tooling
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          has_validator=false; has_contrast=false; has_install_timer=false
          [ -f packaging/fixtures/package.json ] && [ -f packaging/fixtures/validate-schema.mjs ] && has_validator=true
          [ -f packaging/fixtures/design/contrast-check.mjs ] && has_contrast=true
          [ -f packaging/manifest/install-timer/install-timer.mjs ] && has_install_timer=true
          {
            echo "has_validator=$has_validator"
            echo "has_contrast=$has_contrast"
            echo "has_install_timer=$has_install_timer"
          } >> "$GITHUB_OUTPUT"
          [ "$has_validator" = true ] || echo "::notice title=fixtures::No schema validator yet (lands with S0-13/S0-14). Skipping."
          [ "$has_contrast" = true ] || echo "::notice title=fixtures::No contrast check yet (lands with S0-24). Skipping."
          [ "$has_install_timer" = true ] || echo "::notice title=fixtures::No install-timer runner yet (lands with S0-20). Skipping."

      - name: Set up Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.has_validator == 'true' || steps.detect.outputs.has_contrast == 'true' || steps.detect.outputs.has_install_timer == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate brief and health schemas and fixtures (S0-13, S0-14)
        if: steps.detect.outputs.has_validator == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix packaging/fixtures --no-audit --no-fund
          git diff --exit-code -- packaging/fixtures/package-lock.json
          node packaging/fixtures/validate-schema.mjs

      - name: Design token contrast gate (S0-24)
        if: steps.detect.outputs.has_contrast == 'true'
        run: node packaging/fixtures/design/contrast-check.mjs

      # Dependency-free node:test suite. The glob is quoted on purpose: Node >= 21 treats
      # `--test` positionals as globs, and a bare directory path is not matched.
      - name: Install-timer runner tests (S0-20)
        if: steps.detect.outputs.has_install_timer == 'true'
        run: node --test 'packaging/manifest/install-timer/**/*.test.mjs'

      # Service-worker cache-policy audit (S1-04, blueprint §1.2). Dependency-free node:test;
      # self-detecting so this step needs no change to the detect step above. Runs against the
      # worker source; the `php` job's Pest suite covers the built public/sw.js after `npm run build`.
      - name: Service-worker cache audit (S1-04)
        if: hashFiles('packaging/fixtures/e2e/sw-cache-audit.test.mjs') != ''
        run: node --test 'packaging/fixtures/e2e/**/*.test.mjs'

      # Dependency-free node:test suite for the runtime assembler (S1-06); self-detecting so the
      # steps above are untouched. runtime.json itself is validated by validate-schema.mjs.
      - name: Runtime assembler tests (S1-06)
        if: hashFiles('packaging/runtime/test/*.test.mjs') != ''
        run: node --test 'packaging/runtime/test/*.test.mjs'

      # Dependency-free node:test suite for the Supervisor LaunchAgent plist template (S1-07):
      # well-formed plist XML, the ADR-001 D3 keys, no user path and no secret.
      - name: LaunchAgent plist tests (S1-07)
        if: hashFiles('packaging/manifest/launchd/test/*.test.mjs') != ''
        run: node --test 'packaging/manifest/launchd/test/*.test.mjs'

      # Dependency-free node:test suite for the signing scripts and the build-macos workflow (S1-12):
      # no hard-coded identity, secrets only via `${{ secrets.* }}` into env, entitlements present,
      # hardened runtime, Supervisor signed before the app, fail-closed without an identity.
      - name: Signing and DMG pipeline tests (S1-12)
        if: hashFiles('packaging/signing/test/*.test.mjs') != ''
        run: node --test 'packaging/signing/test/*.test.mjs'

  # S1-10 tri-surface brief parity gate (docs/architecture/brief-parity.md §3). One macOS job so
  # the Swift export and the PHP comparison share a filesystem: (a) only the Swift parity test runs
  # and writes one JCS export per brief fixture into build/parity, then (b) Pest renders the mail
  # and the PWA from the same fixtures and compares all three surfaces byte for byte, then (c) the
  # S1-15 vertical slice (blueprint §16 step 8) runs against a freshly installed core with (a) as
  # its menu bar oracle. Not in the S0-27 required-check list yet: §16 step 9 requires it to be
  # (docs/OPEN-QUESTIONS.md A14, docs/operations/vertical-slice.md §5) before Sprint 3 starts.
  #
  # Runs on every pull request rather than behind a `paths` filter: in GitHub Actions a filter is
  # workflow-wide (it would gate php/swift/fixtures too), and it would have to list every file a
  # renderer depends on (view models, locale tables, the document mapper, fixtures, snapshots) —
  # a missed path is a silent hole in the gate. The `php` lane runs the same Pest file with the
  # committed-snapshot oracle; this job is the one that compares against the live Swift export.
  # Not in the S0-27 required-check list yet; the job name `parity` is stable so it can be added.
  parity:
    name: parity
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the three surfaces
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          [ -f tests/E2E/BriefParityTest.php ] || ready=false
          [ -f apps/macos/LaravelExecutiveAITests/MenuBar/BriefParitySnapshotTests.swift ] || ready=false
          [ -d apps/macos/LaravelExecutiveAI.xcodeproj ] || ready=false
          [ -f composer.json ] || ready=false
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "::notice title=parity::The S1-10 parity harness (tests/E2E/BriefParityTest.php + BriefParitySnapshotTests.swift) is not present. Skipping."
          fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: steps.detect.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        if: steps.detect.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/SourcePackages
            apps/macos/.build
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/macos/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve scheme
        if: steps.detect.outputs.ready == 'true'
        id: scheme
        shell: bash
        run: |
          set -euo pipefail
          scheme="$XCODE_SCHEME"
          if [ -z "$scheme" ]; then
            scheme=$(xcodebuild -list -json -project apps/macos/LaravelExecutiveAI.xcodeproj | jq -r '.project.schemes[0] // empty')
          fi
          if [ -z "$scheme" ]; then
            echo "::error::No shared scheme found in apps/macos/LaravelExecutiveAI.xcodeproj."
            exit 1
          fi
          echo "Using scheme: $scheme"
          echo "name=$scheme" >> "$GITHUB_OUTPUT"

      # (a) The menu bar surface. Only the parity test runs; the whole Swift suite is the `swift`
      # job's. The test writes to build/parity under the repository root: an app-hosted XCTest on
      # macOS does not receive xcodebuild's TEST_RUNNER_* environment, so the location is fixed
      # (BriefParitySnapshotTests.defaultExportPath) and emptied here first.
      - name: Swift parity export (menu bar surface)
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        env:
          SCHEME: ${{ steps.scheme.outputs.name }}
        run: |
          set -euo pipefail
          rm -rf build/parity
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project apps/macos/LaravelExecutiveAI.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath build/parity.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:LaravelExecutiveAITests/BriefParitySnapshotTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test \
            | xcbeautify --renderer github-actions

      - name: Require one export per fixture
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixtures=$(find packaging/fixtures/briefs -name 'brief-*.json' | wc -l | tr -d ' ')
          exports=$(find build/parity -name 'brief-*.parity.json' | wc -l | tr -d ' ')
          ls -la build/parity
          if [ "$fixtures" != "$exports" ] || [ "$exports" = 0 ]; then
            echo "::error::Expected $fixtures Swift parity exports in build/parity, found $exports."
            exit 1
          fi

      # (b) The mail and PWA surfaces, compared against (a) by tests/E2E/BriefParityTest.php.
      - name: Set up PHP ${{ env.PHP_VERSION }}
        if: steps.detect.outputs.ready == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, dom, ctype, curl, fileinfo, intl, bcmath, zip, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        if: steps.detect.outputs.ready == 'true'
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        if: steps.detect.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install the Laravel app
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f .env ] || cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress --no-ansi
          php artisan key:generate --ansi --no-interaction

      - name: Pest tri-surface parity (mail + PWA against the Swift export)
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LXAI_SWIFT_PARITY_EXPORT_DIR="$GITHUB_WORKSPACE/build/parity" vendor/bin/pest tests/E2E/BriefParityTest.php --ci

      # (c) S1-15, blueprint §16 step 8: Install → Create owner → Open PWA → Generate seeded brief →
      # Show same brief in menu bar → Preview exact email, as one Pest run against a freshly
      # installed core (throwaway LEA_DATA_DIR, migrated from nothing), with the live Swift export
      # from (a) as the menu bar oracle. The driver validates the report the run writes and prints
      # the version / content_hash triple into the job summary (docs/operations/vertical-slice.md).
      # §16 step 9: this step, in this job, is the gate before any Sprint 3 workstream issue starts.
      - name: Vertical slice (§16 step 8)
        if: steps.detect.outputs.ready == 'true' && hashFiles('tests/E2E/VerticalSliceTest.php') != ''
        shell: bash
        run: |
          set -euo pipefail
          node --version
          LXAI_SWIFT_PARITY_EXPORT_DIR="$GITHUB_WORKSPACE/build/parity" \
            node packaging/fixtures/e2e/vertical-slice.mjs --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the vertical slice report
        if: always() && steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vertical-slice-${{ github.run_id }}
          path: build/e2e/vertical-slice.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Swift parity exports
        if: always() && steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-exports-${{ github.run_id }}
          path: build/parity
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload xcresult bundle
        if: failure() && steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-xcresult-${{ github.run_id }}
          path: build/parity.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # ADR-002 D10 defines a two-profile contract — `local` (SQLite in WAL mode) and
  # `server` (MySQL 8.4 + Redis) — and until this job existed, nothing enforced the
  # second one. #117 is what that cost: `create_passkey_credentials` put a unique
  # index on a 1024-character utf8mb4 column, 4096 bytes against InnoDB's 3072-byte
  # key limit, so `migrate` aborted on that file and every table after it was never
  # created. The `server` profile was unmigratable from a clean database while six
  # required checks stayed green, because not one of them speaks to MySQL.
  #
  # Scope is deliberately the schema, not the whole suite: this job migrates a clean
  # MySQL database and runs the `backend-contract` group, which is the group
  # ADR-002 D10 says must hold on both profiles. The pre-existing whole-suite
  # failures on this profile belong to #111; when that lands, the Pest step here can
  # widen to `vendor/bin/pest --ci`.
  #
  # The job name `server-profile` is stable so the owner can add it to the required
  # checks (docs/contributing/branch-protection.md, S0-27 — owner-only).
  server-profile:
    name: server-profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # ADR-002 D1 names MySQL 8.4. Pinned by manifest digest — the image
        # equivalent of the full-SHA rule this file applies to every action — so a
        # retagged upstream image cannot change what CI tested. Digest verified to
        # be the `8.4` OCI index including linux/amd64.
        image: mysql@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70 # 8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lxai_contract_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LEA_BACKEND_PROFILE: server
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: lxai_contract_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Laravel app
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          has_composer=false
          [ -f composer.json ] && has_composer=true
          echo "has_composer=$has_composer" >> "$GITHUB_OUTPUT"
          if [ "$has_composer" = false ]; then
            echo "::notice title=server-profile::No composer.json at the repo root. Skipping the server-profile migration."
          fi

      - name: Set up PHP ${{ env.PHP_VERSION }}
        if: steps.detect.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, dom, ctype, curl, fileinfo, intl, bcmath, zip, pdo_sqlite, sqlite3, pdo_mysql, mysqli, gd
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        if: steps.detect.outputs.has_composer == 'true'
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        if: steps.detect.outputs.has_composer == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Prepare environment file
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Install Composer dependencies
        if: steps.detect.outputs.has_composer == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi

      - name: Generate application key
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artisan ] && [ -f .env ]; then
            php artisan key:generate --ansi --no-interaction
          fi

      - name: Wait for MySQL
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent 2>/dev/null; then
              mysql -h127.0.0.1 -P3306 -uroot -e "SELECT VERSION();"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=server-profile::MySQL did not become reachable within 60s."
          exit 1

      # The whole point of the job. The service container hands us an empty
      # database, so ALDRIG TÖMMA EN DATABAS is satisfied by construction: nothing
      # here wipes, drops or refreshes anything.
      - name: Migrate the server profile from a clean database
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate --force --no-interaction

      # `migrate` exits 0 when it had nothing to do, so prove it actually ran
      # everything: no migration may be left pending.
      - name: Assert no migration was left pending
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:status --no-interaction | tee migrate-status.txt
          if grep -qi 'pending' migrate-status.txt; then
            echo "::error title=server-profile::A migration is still pending after migrate; the server profile is not fully migrated."
            exit 1
          fi
          ran=$(grep -ci 'ran' migrate-status.txt || true)
          echo "::notice title=server-profile::$ran migrations applied on the server profile."

      # Every expected table, index and foreign key, asserted in PHP where the
      # expectations already live rather than as a list inside this YAML: the
      # `backend-contract` group *is* ADR-002 D10's matrix
      # (tests/Integration/BackendContract/README.md).
      - name: Backend contract on the server profile
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pest --group=backend-contract --ci

      # The regression guards for #117 itself: a duplicate credential id is still
      # refused through the hash, the WebAuthn maximum is storable on MySQL, and a
      # database still on the old shape rolls forward with its rows.
      - name: Passkey credential index regression
        if: steps.detect.outputs.has_composer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pest tests/Feature/Auth/PasskeyCredentialIndexTest.php \
            tests/Feature/Auth/PasskeyCredentialRollForwardTest.php --ci

      - name: Upload migrate:status
        if: always() && steps.detect.outputs.has_composer == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-profile-migrate-status-${{ github.run_id }}
          path: migrate-status.txt
          if-no-files-found: ignore
          retention-days: 7
