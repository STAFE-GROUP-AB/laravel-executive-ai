# build-macos — blueprint §16 step 5 (a signed internal Mac build produced by CI), §12.1 (DMG),
# §14 (codesign / spctl evidence), backlog S1-12 (#40). Job name `build-macos` is stable; do not
# rename it. It is NOT a required check: the `pull_request` trigger below is path-filtered, and a
# required check that never runs on a PR outside those paths would block that PR forever. Drop the
# `paths:` filter first if it ever becomes required (S0-27 rulesets).
#
# What it produces: a Release build of apps/macos (app + embedded Supervisor tool + LaunchAgent
# plist) wrapped in a UDZO disk image, plus build/signing-report.txt with the codesign and spctl
# output — uploaded as artifacts (14 days) on every run, signed or not.
#
# Signing is gated on three repository secrets (packaging/signing/README.md §2):
#   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID  (+ optional APPLE_KEYCHAIN_PASSWORD)
# Pull requests ALWAYS build unsigned (the run proves the pipeline, never touches the identity);
# pushes to main and manual runs sign when all three are present and otherwise fall back to an
# unsigned image named *-unsigned.dmg with a warning. The xcodebuild step itself never signs
# (CODE_SIGNING_ALLOWED=NO, the Shared.xcconfig default); packaging/signing/sign.sh signs the
# finished bundle inside-out afterwards, in a temporary keychain deleted in an always() step.
# Secret values are only ever mapped into `env:`; nothing echoes them and no script enables `set -x`.
#
# The runtime package is downloaded, never built here: `.github/workflows/build-runtime.yml`
# (dispatch only) builds, licence-gates, signs and publishes it as a release asset, and
# `packaging/manifest/runtime.json` pins that asset's URL and sha256. This job verifies the digest,
# unpacks the directory into `Contents/Resources/runtime/` before signing, and refuses a runtime
# from another Apple team. While `runtime.json` has no published artifact the step skips with a
# notice and the image is app + Supervisor only (OPEN-QUESTIONS A23 is decided; the artifact is
# what fills the directory). Notarization and stapling are the Sprint 4 gate — see the disabled
# `notarize` job. Every third-party action is pinned to a full commit SHA.

name: build-macos

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'packaging/signing/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Matches ci.yml and the local toolchain (Xcode 26.2). Bump both together, with S0-22.
  XCODE_VERSION: '26.2'
  XCODE_PROJECT: apps/macos/LaravelExecutiveAI.xcodeproj
  XCODE_SCHEME: LaravelExecutiveAI
  APP_PATH: build/dd/Build/Products/Release/LaravelExecutiveAI.app
  SIGNING_REPORT: build/signing-report.txt
  DIST_DIR: build/dist

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-15
    timeout-minutes: 45
    # The temporary keychain sign.sh creates and the cleanup step deletes defaults to
    # $RUNNER_TEMP/lxai-signing.keychain-db (sign.sh `keychain_path`): outside the checkout, same
    # path in every step of this job. (The `runner` context is not available in workflow- or
    # job-level env, so it is not spelled out here.)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only booleans leave this step. The secret values are mapped into env again, and only
      # there, in the two signing steps below.
      - name: Decide signing mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          signed=false
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "::notice title=build-macos::Pull request run: the image is built unsigned on purpose (the pipeline check never uses the signing identity)."
          elif [ "$HAS_CERTIFICATE" = true ] && [ "$HAS_CERTIFICATE_PASSWORD" = true ] && [ "$HAS_TEAM_ID" = true ]; then
            signed=true
            echo "Signing identity configured: the app, the Supervisor and the image will be Developer ID signed."
          else
            echo "::warning title=build-macos::APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD and APPLE_TEAM_ID are not all set (OPEN-QUESTIONS A12). Building an UNSIGNED debug image instead."
          fi
          status=unsigned
          [ "$signed" = true ] && status=signed
          {
            echo "signed=$signed"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/SourcePackages
            apps/macos/.build
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/macos/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      # Unsigned on purpose: Shared.xcconfig leaves the identity empty and this build never
      # overrides it. sign.sh re-signs the finished bundle so the same build is used in both modes.
      - name: Build Release (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath build/build-macos.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcbeautify --renderer github-actions

      - name: Locate the bundle
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected $APP_PATH after the Release build."
            exit 1
          fi
          for required in Contents/MacOS/LaravelExecutiveAI Contents/Helpers/LaravelExecutiveAISupervisor.app/Contents/MacOS/LaravelExecutiveAISupervisor Contents/Helpers/LaravelExecutiveAISupervisor.app/Contents/Info.plist Contents/Library/LaunchAgents/se.stafe.executive-ai.supervisor.plist; do
            if [ ! -f "$APP_PATH/$required" ]; then
              echo "::error::$APP_PATH is missing $required (S1-07 embeds the Supervisor helper bundle and its LaunchAgent plist; A24)."
              exit 1
            fi
          done
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" >> "$GITHUB_OUTPUT"
          find "$APP_PATH" -maxdepth 5 | sort

      # The runtime package (ADR-001 D4), downloaded rather than built: `build-runtime.yml` built,
      # gated, signed and published it on a pre-release tag, and `packaging/manifest/runtime.json`
      # pins the asset URL and its sha256. It is unpacked BEFORE any signing so the app's resource
      # envelope seals an already-signed `frankenphp` — `sign.sh app` never re-signs anything in
      # here. With `status` not `signed` or no `artifact` (the state until a package is published)
      # the step says so and skips: the image is then app + Supervisor only and the installer stops
      # at PACKAGE_VERIFY, exactly as before.
      - name: Add the runtime package to the bundle
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          read -r status url sha256 bytes asset tag < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("packaging/manifest/runtime.json", "utf8"));
            const a = m.artifact;
            process.stdout.write([m.status, a?.url ?? "-", a?.sha256 ?? "-", a?.bytes ?? "-", a?.asset ?? "-", a?.tag ?? "-"].join(" "));
          ')
          if [ "$status" != signed ] || [ "$url" = - ]; then
            echo "::notice title=build-macos::packaging/manifest/runtime.json is '$status' with no published artifact, so this image carries no runtime package. Run the build-runtime workflow and commit the runtime.json it publishes (packaging/runtime/README.md §5)."
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p build/runtime-download
          curl --fail --silent --show-error --location --retry 3 --output "build/runtime-download/$asset" "$url"
          printf '%s  %s\n' "$sha256" "build/runtime-download/$asset" | shasum -a 256 --check --strict
          actual_bytes="$(stat -f %z "build/runtime-download/$asset")"
          if [ "$actual_bytes" != "$bytes" ]; then
            echo "::error::$asset is $actual_bytes bytes, runtime.json says $bytes."
            exit 1
          fi

          # The tarball holds one `<version>/` directory; --strip-components lands its contents
          # directly in Contents/Resources/runtime/, which is what Bundle.main expects.
          target="$APP_PATH/Contents/Resources/runtime"
          rm -rf "$target"
          mkdir -p "$target"
          tar -xzf "build/runtime-download/$asset" --strip-components=1 -C "$target"

          # The same rules PackageVerifier applies, before the bytes are sealed into the bundle.
          node packaging/runtime/assemble-runtime.mjs --verify "$target"
          codesign --verify --strict --verbose=2 "$target/frankenphp"
          codesign -d --entitlements - --xml "$target/frankenphp" | grep -Fq 'com.apple.security.cs.allow-jit'
          {
            echo "bundled=true"
            echo "tag=$tag"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "Unpacked $asset ($bytes bytes, $tag) into Contents/Resources/runtime."

      # The runtime must come from the same team as the app, or PackageVerifier will refuse it on
      # every install (it builds its requirement from the running app's own signature). Unsigned
      # PR runs have no Team ID to compare against, so they only report what they found.
      - name: Verify the runtime carries the app's Team ID
        if: steps.runtime.outputs.bundled == 'true' && steps.mode.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          team="$(codesign -dvv "$APP_PATH/Contents/Resources/runtime/frankenphp" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The bundled runtime was signed by team '$team', which is not this build's team. PackageVerifier would reject it (support matrix §6.10)."
            exit 1
          fi
          echo "The runtime binary and the app share the same Apple Team ID."

      - name: Note the runtime Team ID check skipped in unsigned mode
        if: steps.runtime.outputs.bundled == 'true' && steps.mode.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=build-macos::Unsigned run: the runtime package is bundled and verified against its manifest, but its Team ID is not compared with the app's (the app has none). A signed main build makes that check."

      # Developer ID signing, inside-out: the already-signed runtime binary unpacked above needs
      # nothing further, then the Supervisor helper bundle — its entitlements with the Team ID
      # prefix expanded, and APPLE_SUPERVISOR_PROFILE written into its
      # Contents/embedded.provisionprofile, without which macOS refuses its restricted
      # keychain-access-groups entitlement at launch (A24) — then the app (its entitlements), which
      # seals both as nested code. Hardened runtime + secure timestamp. sign.sh fails closed if the
      # profile secret is missing.
      - name: Sign the app and the Supervisor
        if: steps.mode.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SUPERVISOR_PROFILE: ${{ secrets.APPLE_SUPERVISOR_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          packaging/signing/sign.sh app "$APP_PATH"

      - name: Create the disk image
        id: dmg
        shell: bash
        env:
          STATUS: ${{ steps.mode.outputs.status }}
          # On a pull request github.sha is the synthetic merge commit; name the image after the head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          packaging/signing/make-dmg.sh --app "$APP_PATH" --out-dir "$DIST_DIR" --sha "${SHA:0:7}" --status "$STATUS"

      # The certificate is already in the temporary keychain; only the Team ID is needed to pick it.
      - name: Sign the disk image
        if: steps.mode.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail
          packaging/signing/sign.sh dmg "$DMG_PATH"

      # Always recorded, also for the unsigned image, where spctl says "rejected" — that is the
      # honest record §14 asks for. In signed mode the step fails unless the app verifies.
      - name: Record codesign and spctl verdicts
        if: always() && steps.locate.outcome == 'success'
        shell: bash
        env:
          LXAI_EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail
          packaging/signing/sign.sh report "$APP_PATH" "$SIGNING_REPORT" "$DMG_PATH"
          {
            echo '## Signing report'
            echo
            echo '```'
            sed -n '1,12p' "$SIGNING_REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image
        if: always() && steps.dmg.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the signing report
        if: always() && steps.locate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-report-${{ steps.mode.outputs.status }}-${{ github.run_id }}
          path: ${{ env.SIGNING_REPORT }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcresult bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos-xcresult-${{ github.run_id }}
          path: build/build-macos.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete the temporary keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packaging/signing/sign.sh cleanup
          security list-keychains -d user

  # Sprint 4 release gate, intentionally disabled (`if: false`): notarization and stapling are
  # backlog row "E4-6 Release engineering and docs completeness" (docs/BACKLOG.md, Sprint 4; no
  # GitHub issue exists for it yet — open one when Sprint 4 is planned) and §14 of the release
  # checklist (docs/operations/release-policy.md §5). It needs a Developer-ID-signed image from the
  # job above plus three more secrets (App Store Connect API key id, issuer id and the .p8), which do
  # not exist today. The outline is kept here so the gap is visible in the workflow, not only in
  # the docs: packaging/notarization/README.md.
  notarize:
    name: notarize (disabled until Sprint 4 / E4-6)
    if: false
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Not implemented
        shell: bash
        run: |
          set -euo pipefail
          echo "xcrun notarytool submit <dmg> --key <p8> --key-id <id> --issuer <issuer> --wait"
          echo "xcrun stapler staple <dmg> && xcrun stapler validate <dmg>"
          echo "spctl --assess --type open --context context:primary-signature --verbose <dmg>  # must be 'accepted'"
          exit 1
