# Dependabot — blueprint §11 (pinned Composer/npm/Swift dependencies), backlog S0-05.
# Weekly, grouped, Conventional Commits prefixes. Until S0-26 (composer.json, package.json)
# and S0-25 (apps/macos) land, Dependabot reports "manifest not found" for those ecosystems;
# that is expected and non-blocking.
#
# Swift note: the `swift` ecosystem reads a Package.swift. The only one in the repo is the
# local DesignTokens package (S0-24); the app in apps/macos/LaravelExecutiveAI.xcodeproj links it
# as a local package reference and has no Package.swift of its own (S0-25). Add a second `swift`
# entry if a further local package appears.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      composer-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      composer-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: swift
    directory: /apps/macos/DesignTokens
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      swift:
        update-types:
          - minor
          - patch
