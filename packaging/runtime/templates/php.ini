; Laravel Executive AI runtime php.ini (ADR-001 D2/D4).
;
; Static and identical on every Mac: no path, no port, no secret. The Supervisor points PHP at
; this file with PHPRC=<runtime dir> (docs/architecture/runtime-layout.md). Anything that
; varies per install (data directory, port) is process environment, never an ini value.

[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20
allow_url_include = Off
enable_dl = Off
default_charset = "UTF-8"
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.assertions = -1

; ADR-001 D2: PCRE JIT stays on (the runtime carries com.apple.security.cs.allow-jit for it).
pcre.jit = 1

[opcache]
; ADR-001 D2/D4: OPcache on for every SAPI, the machine-code JIT off. The runtime directory is
; immutable, so timestamps are never re-checked; compiled Blade views live in data/ under
; per-version file names, which is why a stale-cache window cannot open on upgrade.
opcache.enable = 1
opcache.enable_cli = 1
opcache.jit = disable
opcache.jit_buffer_size = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.file_cache_only = 0

[session]
; Laravel owns the session (database driver); these only harden PHP's own defaults.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

[mail function]
; Nothing in the runtime may hand mail to a system MTA; Laravel's mailers are explicit.
sendmail_path =
