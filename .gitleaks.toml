# gitleaks configuration (CI job `secrets-scan`, blueprint §11).
# Extends the built-in rules; adds precise allowlists only. Never allowlist a path on its own: an
# allowlist that names a path must also constrain what it matches there (`condition = "AND"`).

title = "Laravel Executive AI"

[extend]
useDefault = true

[[allowlists]]
description = "ULIDs are identifiers, not secrets (brief/health fixtures use them in *_key fields)"
regexTarget = "secret"
regexes = ['''^[0-7][0-9A-HJKMNP-TV-Z]{25}$''']

# S0-19: the adversarial security corpora contain attacker payloads that offer the agent a
# credential, because refusing one is the behaviour under test. Those values are deliberately
# impossible to confuse with a live key — the literal prefix `sk-FAKE-` followed by zeroes — and the
# allowlist matches ONLY that shape AND only inside the corpora, so a real key committed next to it
# is still reported. The hostile-MCP and prompt-injection fixtures are the only place this shape may
# appear; if a new provider shape is needed, add it here with the same two constraints.
[[allowlists]]
description = "Obviously-fake credential shapes in the S0-19 security corpora (sk-FAKE-0000…)"
condition = "AND"
paths = ['''^packaging/fixtures/security/.*\.json$''']
regexes = ['''sk-FAKE-0{8,}''']

# S1-01: tests/Security/fixtures/secrets-corpus.json holds synthetic tokens in every format the
# Redactor handles (ADR-003 D7, threat model T-10 to T-14). Every value carries a visible marker —
# the literal FAKE or TEST, `RkFLR` (base64 of "FAKE") inside base64 bodies, or the
# `0123456789abcdef` hex filler inside the IPC tokens — and the allowlist matches ONLY values with
# such a marker AND only inside that one file. A real credential pasted into the corpus by mistake
# is still reported. Owner: security lead (workstream H); extend together with the corpus.
[[allowlists]]
description = "Marked synthetic secrets in the S1-01 redaction corpus (FAKE/TEST/RkFLR/0123456789abcdef)"
condition = "AND"
paths = ['''^tests/Security/fixtures/secrets-corpus\.json$''']
regexes = ['''(?i)(FAKE|TEST|RkFLR|0123456789abcdef)''']
